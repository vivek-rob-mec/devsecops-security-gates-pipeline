name: devsecops-reference

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight
        run: bash scripts/preflight.sh
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - name: SCA
        run: bash scripts/sca-scan.sh
      - name: SAST
        run: bash scripts/sast-scan.sh
      - name: IaC scan
        run: bash scripts/iac-scan.sh
      - name: Preserve reports even after a failed scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security-reports
          path: reports/generated/
          retention-days: 14
          if-no-files-found: warn

  # Add build/test/image/SBOM/sign/deploy jobs for the target application.
  # Provision reviewed gitleaks, trivy and semgrep binaries before Preflight.
  # The hosted runner does not provide these tools as a guaranteed contract.
  # In production repositories, pin third-party actions to trusted commit SHAs.
